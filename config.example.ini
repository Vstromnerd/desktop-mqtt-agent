; Example settings. INSTALL.bat creates config.ini for you; to do it by hand,
; copy this file to config.ini and fill in your own details.

[mqtt]
; IP address or host name of your MQTT broker (e.g. the Mosquitto broker app in Home Assistant)
host = 192.168.1.10
port = 1883
; A Home Assistant user, e.g. "pc-agent" (see README)
username = pc-agent
; Leave empty: the agent moves a password typed here into Windows Credential Manager
; on first start and clears this line.
password =

[device]
; Name of the device in Home Assistant
name = My PC
; Optional: fixed ID (defaults to the computer name)
id =
; Language of the entity names: en or nl
language = en

[agent]
; How often the status is sent (seconds)
interval = 15
; Minutes without mouse/keyboard input before "In use" turns off
in_use_idle_minutes = 5
; Show and run the sleep/shut down/restart buttons in HA
allow_power_commands = true
; Seconds to wait on shut down/restart (cancel with: shutdown /a)
shutdown_delay = 5

[lhm]
; Set to true when LibreHardwareMonitor runs with its web server on (port 8085)
enabled = false
url = http://localhost:8085/data.json
; Path suffixes as shown in LibreHardwareMonitor
cpu_temp = Temperatures/Core (Tctl/Tdie)
gpu_temp = Temperatures/GPU Core
gpu_load = Load/GPU Core
